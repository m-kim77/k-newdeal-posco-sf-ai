<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>11단원 개념05 - 이벤트 위임</title>
    <link rel="stylesheet" href="./concept_03_css.css" />
    <script src="./concept_03_js.js" defer></script>
  </head>
  <body>
    <h1>개념 05 — 이벤트 위임</h1>

    <p class="guide">
      브라우저로 열고 <strong>할 일을 추가</strong>한 뒤, 글자를 눌러 완료
      처리하거나 삭제 버튼을 눌러 보세요.
      <strong>새로 추가한 항목도 똑같이 동작합니다.</strong> 그게 이 파일의
      핵심입니다. <strong>F12 → Console</strong> 도 함께 보세요.

      <br /><br />
      <strong>HTML 과 CSS 는 몰라도 됩니다.</strong> 이 파일 위쪽의
      <code>&lt;style&gt;</code> 과 <code>&lt;body&gt;</code> 는 화면 모양을
      만드는 코드입니다. 이 자료에서는 가르치지 않습니다.
      <code>&lt;script&gt;</code> 안부터 읽으세요.
    </p>

    <div class="demo">
      <h3>할 일 목록</h3>
      <input type="text" id="todoInput" placeholder="할 일을 입력하고 Enter" />
      <button id="addBtn">추가</button>

      <ul id="todoList">
        <li data-id="1">
          <span class="text">처음부터 있던 항목</span>
          <button class="deleteBtn">삭제</button>
        </li>
      </ul>

      <div class="output" id="status">항목 1개</div>
    </div>
  </body>
</html>
